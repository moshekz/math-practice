<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>CALC//12 · אימון לבגרות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--ink:#e8ecf6;--mut:#8b93a9;--glass:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);
--cy:#22d3ee;--li:#a3e635;--vi:#a78bfa;--pk:#f472b6;--am:#fbbf24;--bl:#60a5fa;--ok:#34d399;--bad:#fb7185;--part:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.55;min-height:100vh;
 background-image:radial-gradient(900px 500px at 85% -10%,rgba(167,139,250,.18),transparent 60%),radial-gradient(700px 500px at -10% 20%,rgba(34,211,238,.13),transparent 60%),
 linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 80px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.mono,.m{font-family:'JetBrains Mono',monospace}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-weight:700;font-size:.92em}
.mut{color:var(--mut)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 2px}
.frac>span:last-child{padding:2px 4px 0}
/* top */
.logo{font-family:'JetBrains Mono';font-weight:800;letter-spacing:1px;font-size:15px;color:var(--cy);direction:ltr;display:inline-block}
.logo b{color:var(--vi)}
.hero{position:relative;border:1px solid var(--bd);background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(167,139,250,.10) 60%,rgba(244,114,182,.08));border-radius:24px;padding:22px;overflow:hidden}
.hero:after{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,var(--cy),transparent 40%,var(--vi));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero h1{font-size:30px;font-weight:900;margin:6px 0 2px;letter-spacing:-.3px}
.hero .sub{color:var(--mut)}
.rank{display:flex;align-items:center;gap:12px;margin-top:16px}
.rank .tag{font-family:'JetBrains Mono';font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(34,211,238,.12);color:var(--cy);border:1px solid rgba(34,211,238,.35);white-space:nowrap}
.xp{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));box-shadow:0 0 14px rgba(34,211,238,.7);border-radius:99px;transition:width .8s}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-family:'JetBrains Mono';font-size:22px;font-weight:800}
.kpi span{font-size:12px;color:var(--mut)}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sect h2{font-size:18px;font-weight:800;margin:0}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.tc:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);box-shadow:0 0 16px var(--c)}
.tc .ic{font-family:'JetBrains Mono';color:var(--c);font-weight:800;font-size:14px}
.tc .nm{font-weight:800;margin:4px 0 10px;font-size:16px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;box-shadow:0 0 10px var(--c)}
.tc .pc{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.btn{position:relative;font-weight:800;font-size:19px;padding:15px 34px;border-radius:14px;background:linear-gradient(135deg,var(--cy),var(--vi));color:#05070d;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 30px rgba(34,211,238,.25);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 14px 36px rgba(167,139,250,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--bd);box-shadow:none}
.btn.sm{font-size:15px;padding:10px 18px}
.link{background:none;color:var(--cy);font-weight:700;font-size:15px;padding:6px}
.foot{display:flex;justify-content:space-between;margin-top:26px;font-size:14px}
.note{text-align:center;color:var(--mut);font-size:14px}
/* page */
.ph{position:sticky;top:8px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(7,11,20,.85);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px;padding:10px 14px}
.ph h2{margin:0;font-size:18px;font-weight:800}
.prog{display:flex;gap:6px}
.prog i{width:26px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);transition:.3s}
.prog i.on{background:var(--cy);box-shadow:0 0 10px var(--cy)}
.q{background:var(--glass);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:16px 0;position:relative;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.q:before{content:"";position:absolute;top:18px;bottom:18px;right:0;width:3px;border-radius:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.qh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qn{font-family:'JetBrains Mono';font-weight:800;color:var(--c);font-size:14px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.ctx{color:#b9c1d6;font-size:15.5px}
.fx{direction:ltr;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:21px;margin:12px 0;padding:14px 10px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--bd);color:#fff;overflow-x:auto;white-space:nowrap}
.fx .fn{color:var(--c)}
.ask{font-weight:700;font-size:17.5px}
.fields{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;align-items:flex-start}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label{font-size:13.5px;color:var(--mut);font-weight:700}
.inp{width:170px;font:700 19px 'JetBrains Mono';padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:rgba(0,0,0,.35);color:#fff;direction:ltr;text-align:center;transition:.2s}
.inp:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.pv{font-family:'JetBrains Mono';font-size:12.5px;color:var(--mut);min-height:18px;direction:ltr;text-align:center}
.pv.bad{color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{text-align:right;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:rgba(0,0,0,.25);font-size:15.5px;line-height:1.5;transition:.15s}
.opt:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px var(--c) inset}
.opt.g{padding:6px;text-align:center}
.opt.g .gl{font-family:'JetBrains Mono';font-weight:800;color:var(--c)}
.plot{width:100%;height:auto;display:block}
.hint{font-size:13px;color:var(--mut);margin-top:10px}
/* results */
.rh{text-align:center;border:1px solid var(--bd);border-radius:24px;padding:24px;background:linear-gradient(160deg,rgba(34,211,238,.08),rgba(167,139,250,.08))}
.big{font-family:'JetBrains Mono';font-weight:800;font-size:64px;line-height:1;background:linear-gradient(135deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.rh .msg{font-weight:800;font-size:20px;margin-top:8px}
.pill{display:inline-block;margin:10px 4px 0;padding:5px 12px;border-radius:99px;font-weight:800;font-size:14px;background:rgba(251,191,36,.12);color:var(--am);border:1px solid rgba(251,191,36,.35)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;text-align:right}
.sum>div{border-radius:16px;padding:12px 14px;border:1px solid var(--bd)}
.sum .g{background:rgba(52,211,153,.07)}
.sum .w{background:rgba(251,113,133,.07)}
.sum h3{margin:0 0 6px;font-size:16px}
.sum ul{margin:0;padding-right:18px;font-size:14.5px}
.rc{border:1px solid var(--bd);background:var(--glass);border-radius:18px;padding:16px;margin:14px 0;border-right:5px solid var(--s)}
.rc.ok{--s:var(--ok)}.rc.wrong,.rc.blank{--s:var(--bad)}.rc.partial{--s:var(--part)}
.rt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ri{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;color:#05070d;background:var(--s)}
.rc .fx{font-size:17px;padding:10px}
.rq{font-size:15px;color:#c3cad9;margin-top:8px}
.ans{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.ans>div{border-radius:12px;padding:8px 12px;font-size:14.5px;background:rgba(0,0,0,.3);border:1px solid var(--bd)}
.ans .bad{border-color:rgba(251,113,133,.4)}
.ans .good{border-color:rgba(52,211,153,.45)}
.err{margin-top:10px;border:1px dashed rgba(251,191,36,.5);background:rgba(251,191,36,.06);border-radius:14px;padding:10px 12px}
.err b{color:var(--am)}
.err p{margin:4px 0 0;font-size:14.5px;color:#d7dceb}
details{margin-top:10px}
summary{cursor:pointer;color:var(--cy);font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ "}details[open] summary:before{content:"▾ "}
.sol{margin:8px 0 0;padding-right:20px;font-size:15px}
.sol li{margin:5px 0}
.rplot{max-width:300px;margin:8px auto 0}
/* stats */
.panel{border:1px solid var(--bd);background:var(--glass);border-radius:18px;padding:16px;margin:14px 0}
.panel h3{margin:0 0 10px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.06);text-align:right}
th{color:var(--mut);font-weight:600;font-size:12.5px}
.mb{height:6px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden;min-width:60px}
.mb i{display:block;height:100%;border-radius:9px}
.cnt{display:inline-block;min-width:26px;text-align:center;background:rgba(251,113,133,.15);color:var(--bad);border-radius:99px;font-weight:800;font-size:12.5px;padding:1px 7px;margin-left:6px}
/* modal / fx */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.mod{background:#0f1524;border:1px solid var(--bd);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
.mod p{font-size:18px;margin:0 0 14px}
.mod .inp{width:100%;direction:rtl;font-family:Heebo;margin-bottom:14px}
.burst{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:600px){
 .tgrid{grid-template-columns:1fr 1fr}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .opts{grid-template-columns:1fr}
 .opts.gr{grid-template-columns:1fr 1fr}
 .sum{grid-template-columns:1fr}
 .fx{font-size:17px}
 .hero h1{font-size:25px}
 .inp{width:150px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ================= utils ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f3=n=>{if(n==null||!isFinite(n))return '?';const r=Math.round(n*1000)/1000;return String(Object.is(r,-0)?0:r).replace('-','−')};
const M=s=>`<span class="m">${s}</span>`;
const neg=n=>String(n).replace('-','−');
const term=(c,s)=>c>0?` + ${c===1&&s?'':c}${s}`:c<0?` − ${c===-1&&s?'':-c}${s}`:'';
const poly2=(s,p)=>'x²'+term(-s,'x')+term(p,'');
const lin=p=>'x'+term(-p,'');
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const lt=(a,op,b)=>M(`${a} ${op} ${b}`);
/* expression evaluator: ln2-1, 2/e, sqrt(5), e^2 ... */
function evalExpr(str){
 const s=String(str).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/√/g,'sqrt').replace(/π/g,'pi');
 if(!s)return null;let i=0;
 function primary(){
  if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v}
  let m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(m){i+=m[0].length;return parseFloat(m[0])}
  m=s.slice(i).match(/^(ln|log|sqrt|pi|e)/);
  if(m){i+=m[0].length;const id=m[0];if(id==='pi')return Math.PI;if(id==='e')return Math.E;const a=power();
   return id==='ln'?Math.log(a):id==='log'?Math.log10(a):Math.sqrt(a)}
  throw 0;
 }
 function power(){const b=primary();if(s[i]==='^'){i++;return Math.pow(b,unary())}return b}
 function unary(){if(s[i]==='-'){i++;return -unary()}if(s[i]==='+'){i++;return unary()}return power()}
 function trm(){let v=unary();while(i<s.length){const c=s[i];if(c==='*'){i++;v*=unary()}else if(c==='/'){i++;v/=unary()}else if(/[\d.(a-z]/.test(c))v*=unary();else break}return v}
 function expr(){let v=trm();while(s[i]==='+'||s[i]==='-'){const c=s[i++];const t=trm();v=c==='+'?v+t:v-t}return v}
 try{const v=expr();return i===s.length?v:NaN}catch(e){return NaN}
}
/* ================= errors ================= */
const ERR={
 blank:['לא נענה','גם ניסיון חלקי שווה נקודות בבגרות. תמיד כדאי לכתוב משהו.'],
 format:['לא הצלחתי לקרוא את התשובה','כתבו מספר או ביטוי, למשל: ln2-1, 2/e, sqrt(5).'],
 arithmetic:['טעות חישוב','הדרך אולי נכונה. בדקו כל שלב, במיוחד סימנים ושברים.'],
 precision:['דיוק לא מספיק','בבגרות מבקשים לרוב שלוש ספרות אחרי הנקודה. עגלו רק בסוף החישוב.'],
 dom_reversed:['תחום ההגדרה הפוך','ln מוגדר רק כשהביטוי שבתוכו חיובי. בדקו בטבלת סימנים איפה הביטוי > 0.'],
 dom_closed:['כללתם נקודות שבהן הביטוי = 0','ln(0) לא מוגדר. התחום פתוח: < ולא ≤.'],
 dom_denominator:['בדקתם רק את המכנה','בתוך ln צריך שהביטוי כולו יהיה חיובי, לא רק שהמכנה ≠ 0.'],
 dom_partial:['חסר חלק מהתחום','פרבולה "צוחקת" חיובית בשני הצדדים של השורשים, לא רק בצד אחד.'],
 dom_ln_x:['בלבול עם ln x','בתוך ה-ln יש x² + k². הביטוי הזה תמיד חיובי, ולכן f מוגדרת לכל x.'],
 asym_missing:['חסרה אסימפטוטה','בודקים גם קצוות של התחום (אנכיות) וגם x→∞ (אופקית).'],
 asym_wrong:['אסימפטוטה לא נכונה','אנכית: בקצה התחום שבו הביטוי בתוך ln שואף ל-0⁺ או ל-∞. אופקית: רק אם ל-f יש גבול סופי כש-x→∞.'],
 asym_ln_limit:['שכחתם להפעיל ln על הגבול','אם הביטוי בתוך ה-ln שואף ל-1, אז f שואפת ל-ln1 = 0.'],
 chain_rule:['שכחתם את כלל השרשרת','(ln u)′ = u′/u, ולא 1/u.'],
 deriv_rule:['טעות בגזירה','בדקו כל איבר: (ln x)′ = 1/x, (x/k)′ = 1/k, (kx)′ = k.'],
 quotient:['טעות בנגזרת מנה','(u/v)′ = (u′v − uv′)/v². הסדר במונה חשוב.'],
 log_rule:['טעות בחוקי לוגריתמים','ln(a/b) = ln a − ln b,  ln(a²) = 2ln a.'],
 forgot_ln:['שכחתם את ה-ln','הצבתם בביטוי שבתוך ה-ln, אבל צריך להפעיל עליו ln.'],
 tangent_n:['טעות בחישוב n','n = f(x₀) − m·x₀. מציבים את נקודת ההשקה במשוואה y = mx + n.'],
 ln_zero:['פתרתם u = 0 במקום u = 1','ln u = 0 ⇔ u = 1. הנקודות שבהן u = 0 הן האסימפטוטות.'],
 ext_type:['סוג הקיצון שגוי','בודקים בטבלת סימנים של f′: מ-+ ל-− זה מקסימום, ומ-− ל-+ זה מינימום.'],
 stationary_not_ext:['f′ = 0 לא תמיד קיצון','צריך החלפת סימן של f′. אם f′ ≤ 0 משני הצדדים, אין קיצון.'],
 ext_value:['ערך y שגוי','מציבים את x של הקיצון בפונקציה המקורית f, לא ב-f′.'],
 ext_x_zero:['השתמשתם באפס של f במקום של f′','קיצון מחפשים איפה f′(x) = 0, לא איפה f(x) = 0.'],
 mono_reversed:['עלייה וירידה הפוכות','f′ > 0 ⇒ עולה; f′ < 0 ⇒ יורדת. בדקו בנקודה אחת בכל קטע.'],
 ignore_domain:['התעלמתם מתחום ההגדרה','כל תשובה (עלייה, ירידה, אי-שוויון) נכונה רק בתוך תחום ההגדרה.'],
 mono_union:['אי אפשר לאחד את הקטעים','הפונקציה יורדת בכל קטע בנפרד. בין הקטעים יש קפיצה, ולכן לא "יורדת לכל x".'],
 ineq_used_stationary:['השתמשתם בנקודה הלא נכונה','לאי-שוויון f ≥ 0 צריך את נקודת האפס של f, לא את הנקודה שבה f′ = 0.'],
 ineq_direction:['כיוון הפוך','הציבו נקודה אחת מכל צד ובדקו את הסימן של f. כשהפונקציה יורדת, היא חיובית משמאל לנקודת האפס.'],
 ineq_all:['כל התחום לא מתאים','בודקים את הסימן בכל קטע של התחום בנפרד.'],
 graph_reflect:['גרף משוקף','הציבו נקודה אחת ובדקו את הסימן של f. למשל f(x) חיובית או שלילית?'],

 der:{n:'נגזרת ומשיק',ic:"f′(x)",c:'#a3e635'},
 ext:{n:'קיצון ומונוטוניות',ic:'max/min',c:'#f472b6'},
 graph:{n:'זיהוי גרפים',ic:'I-IV',c:'#60a5fa'},
 ineq:{n:'אפסים ואי-שוויונות',ic:'f ≥ 0',c:'#fbbf24'}
};
const SK={
 dom:{t:'dom',n:'תחום הגדרה',g:qDom,w:1.5},yint:{t:'dom',n:'חיתוך עם ציר y',g:qYint,w:1},
 asym:{t:'asym',n:'אסימפטוטות',g:qAsym,w:1.5},
 der:{t:'der',n:'חישוב נגזרת',g:qDer,w:1.4},tan:{t:'der',n:'משוואת משיק',g:qTan,w:1.4},
 ext:{t:'ext',n:'נקודות קיצון',g:qExt,w:1.5},mono:{t:'ext',n:'עלייה וירידה',g:qMono,w:1.3},
 graph:{t:'graph',n:'התאמת גרף',g:qGraph,w:1.3},
 zeros:{t:'ineq',n:'נקודות אפס',g:qZeros,w:1.2},ineq:{t:'ineq',n:'אי-שוויונות',g:qIneq,w:1.3}
};
const RANKS=['טירון','מתקדם','אנליטיקאי','מהנדס','מאסטר','אגדה'];const LV=150;
/* ================= state ================= */
const KEY='calc12-v1';
const blank=()=>({name:'',xp:0,sets:[],days:[]});
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const val=st=>st==='ok'?1:st==='partial'?.5:0;
const items=()=>S.sets.flatMap(s=>s.items);
function skAcc(k){const h=items().filter(i=>i.s===k).slice(-10);return(h.reduce((a,i)=>a+val(i.st),0)+1.5)/(h.length+3)}
const skW=k=>SK[k].w*(0.35+1.65*(1-skAcc(k)));
function tAcc(t,n=15){const h=items().filter(i=>SK[i.s]&&SK[i.s].t===t).slice(-n);return{n:items().filter(i=>SK[i.s]&&SK[i.s].t===t).length,acc:h.length?h.reduce((a,i)=>a+val(i.st),0)/h.length:null}}
function wpick(arr,wf){const ws=arr.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
function buildSet(){
 const tl=Object.keys(TOPICS),tw=t=>Object.keys(SK).filter(k=>SK[k].t===t).reduce((a,k)=>a+skW(k),0);
 const chosen=[];const pool=tl.slice();while(chosen.length<5){const t=wpick(pool,tw);chosen.push(t);pool.splice(pool.indexOf(t),1)}
 return chosen.map(t=>{const k=wpick(Object.keys(SK).filter(x=>SK[x].t===t),skW);const q=SK[k].g();q.skill=k;q.topic=t;return q});
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())){n++;d.setDate(d.getDate()-1)}return n}
const lvl=()=>{const i=Math.floor(S.xp/LV);return{i,name:RANKS[Math.min(i,RANKS.length-1)],pct:S.xp%LV/LV*100,left:LV-S.xp%LV}};
/* ================= UI ================= */
const app=document.getElementById('app');let view='home',cur=null;
function render(){({home,set:setView,res,stats})[view]();window.scrollTo({top:0,behavior:'instant'})}
const go=v=>{view=v;render()};
function home(){
 const L=lvl(),all=items(),acc=all.length?Math.round(all.reduce((a,i)=>a+val(i.st),0)/all.length*100):null;
 const ready=Math.round(Object.keys(TOPICS).reduce((a,t)=>{const s=tAcc(t);return a+(s.acc==null?0:s.acc*Math.min(1,s.n/6))},0)/6*100);
 const tg=Object.entries(TOPICS).map(([k,t])=>{const s=tAcc(k);return `<div class="tc" style="--c:${t.c}"><div class="ic">${t.ic}</div><div class="nm">${t.n}</div><div class="bar"><i style="width:${s.acc==null?0:Math.round(s.acc*100)}%"></i></div><div class="pc"><span>${s.acc==null?'עוד לא תורגל':Math.round(s.acc*100)+'%'}</span><span>${s.n} שאלות</span></div></div>`}).join('');
 app.innerHTML=`<div class="hero"><span class="logo">CALC<b>//</b>12</span>
 <h1>${S.name?'מה קורה, '+esc(S.name)+'?':'מוכן לבגרות?'}</h1><div class="sub">חקירת פונקציות לוגריתמיות: סטים קצרים של 5 שאלות, כל פעם מנושא אחר.</div>
 <div class="rank"><span class="tag">LVL ${L.i+1} · ${L.name}</span><div class="xp"><i style="width:${L.pct}%"></i></div></div>
 <div class="kpis"><div class="kpi"><b>${S.xp}</b><span>XP</span></div><div class="kpi"><b>${streak()}🔥</b><span>ימים ברצף</span></div><div class="kpi"><b>${acc==null?'—':acc+'%'}</b><span>דיוק</span></div><div class="kpi"><b>${ready}%</b><span>מוכנות לבגרות</span></div></div></div>
 <div class="cta"><button class="btn" id="go">▶ &nbsp;סט חדש</button></div>
 <div class="note">עוד ${L.left} XP לרמה הבאה · אפשר להקליד גם ביטויים כמו <span class="m">ln2-1</span> או <span class="m">2/e</span></div>
 <div class="sect"><h2>הנושאים</h2><span class="mut" style="font-size:13px">התרגול מתמקד אוטומטית בנושאים החלשים</span></div>
 <div class="tgrid">${tg}</div>
 <div class="foot"><button class="link" id="nm">✏️ ${S.name?'שינוי שם':'הוספת שם'}</button><button class="link" id="st">📊 סטטיסטיקה</button></div>`;
 document.getElementById('go').onclick=startSet;document.getElementById('st').onclick=()=>go('stats');document.getElementById('nm').onclick=askName;
 if(!S.name&&!S.sets.length&&!home.asked){home.asked=true;setTimeout(askName,300)}
}
function askName(){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="mod"><p>איך קוראים לך?</p><input class="inp" id="ni" maxlength="20" value="${esc(S.name)}"><div class="cta" style="margin:0"><button class="btn sm" data-y>שמירה</button><button class="btn ghost sm" data-n>דילוג</button></div></div>`;
 document.body.appendChild(o);const i=o.querySelector('#ni');i.focus();
 const ok=()=>{S.name=i.value.trim();save();o.remove();render()};o.querySelector('[data-y]').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()};o.querySelector('[data-n]').onclick=()=>o.remove();
}
function modal(t,[y,n]){return new Promise(r=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mod"><p>${t}</p><div class="cta" style="margin:0"><button class="btn sm" data-y>${y}</button><button class="btn ghost sm" data-n>${n}</button></div></div>`;document.body.appendChild(o);o.querySelector('[data-y]').onclick=()=>{o.remove();r(true)};o.querySelector('[data-n]').onclick=()=>{o.remove();r(false)}})}
function startSet(){cur={n:S.sets.length+1,qs:buildSet()};go('set')}
function fieldHtml(f,i){
 if(f.kind==='num')return `<div class="fld"><label dir="auto">${f.label}</label><input class="inp" data-i="${i}" data-k="${f.k}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"><div class="pv"></div></div>`;
 return `<div class="fld" style="flex-basis:100%">${f.label?`<label>${f.label}</label>`:''}<div class="opts ${f.graph?'gr':''}" data-i="${i}" data-k="${f.k}">${f.opts.map((o,j)=>`<button class="opt ${f.graph?'g':''}" data-j="${j}">${o.h}</button>`).join('')}</div></div>`;
}
function setView(){
 app.innerHTML=`<div class="ph"><h2><span class="logo">SET</span> #${cur.n}</h2><div class="prog">${cur.qs.map((_,i)=>`<i data-p="${i}"></i>`).join('')}</div><button class="link" id="x">✕ יציאה</button></div>
 ${cur.qs.map((q,i)=>{const t=TOPICS[q.topic];return `<div class="q" style="--c:${t.c};animation-delay:${i*.06}s"><div class="qh"><span class="qn">Q${i+1}</span><span class="chip">${t.n}</span><span class="mut" style="font-size:13px">${SK[q.skill].n}</span></div>
 <div class="ctx">${q.F.ctx}</div><div class="fx">${q.F.html}</div><div class="ask">${q.ask}</div>
 <div class="fields">${q.fields.map(f=>fieldHtml(f,i)).join('')}</div></div>`}).join('')}
 <div class="cta"><button class="btn" id="sub">סיימתי – לבדיקה ⚡</button></div>`;
 const sel={};
 const upd=()=>cur.qs.forEach((q,i)=>{const done=q.fields.every(f=>f.kind==='num'?(app.querySelector(`.inp[data-i="${i}"][data-k="${f.k}"]`).value.trim()):(sel[i+'_'+f.k]!=null));app.querySelector(`[data-p="${i}"]`).classList.toggle('on',done)});
 app.querySelectorAll('.inp').forEach((el,idx,all)=>{
  el.addEventListener('input',()=>{const pv=el.nextElementSibling,v=el.value.trim();if(!v){pv.textContent='';pv.classList.remove('bad')}else{const n=evalExpr(v);if(n==null||!isFinite(n)){pv.textContent='?';pv.classList.add('bad')}else{pv.textContent=/^[-−]?\d*\.?\d+$/.test(v)?'':'≈ '+f3(n);pv.classList.remove('bad')}}upd()});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const nx=all[idx+1];nx?nx.focus():document.getElementById('sub').focus()}});
 });
 app.querySelectorAll('.opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel[g.dataset.i+'_'+g.dataset.k]=b.dataset.j;upd()}));
 document.getElementById('x').onclick=async()=>{if(await modal('לצאת מהסט? התשובות לא יישמרו.',['לצאת','להישאר']))go('home')};
 document.getElementById('sub').onclick=async()=>{
  const vals=cur.qs.map((q,i)=>{const o={};q.fields.forEach(f=>{o[f.k]=f.kind==='num'?app.querySelector(`.inp[data-i="${i}"][data-k="${f.k}"]`).value:sel[i+'_'+f.k]});return o});
  const missing=vals.filter((v,i)=>cur.qs[i].fields.some(f=>v[f.k]==null||String(v[f.k]).trim()==='')).length;
  if(missing&&!(await modal(`${missing===1?'שאלה אחת לא הושלמה':missing+' שאלות לא הושלמו'}. לבדוק בכל זאת?`,['לבדוק','לחזור'])))return;
  cur.vals=vals;finish();
 };
}
function finish(){
 cur.res=cur.qs.map((q,i)=>{try{return q.check(cur.vals[i])}catch(e){return{st:'wrong',e:'arithmetic'}}});
 const sc=cur.res.filter(r=>r.st==='ok').length;let xp=cur.res.reduce((a,r)=>a+(r.st==='ok'?20:r.st==='partial'?8:0),0);if(sc===5)xp+=40;else if(sc===4)xp+=15;
 const before=lvl().i;S.xp+=xp;
 S.sets.push({t:Date.now(),score:sc,items:cur.qs.map((q,i)=>({s:q.skill,st:cur.res[i].st,e:cur.res[i].e||null}))});if(S.sets.length>250)S.sets=S.sets.slice(-250);
 if(!S.days.includes(today()))S.days.push(today());if(S.days.length>150)S.days=S.days.slice(-150);
 cur.xp=xp;cur.sc=sc;cur.up=lvl().i>before;save();go('res');if(sc>=4)setTimeout(burst,200);
}
function userAns(q,v){return q.fields.map(f=>{const x=v[f.k];if(x==null||String(x).trim()==='')return '—';if(f.kind==='num')return (q.fields.length>1?f.label+' ':'')+M(esc(x));const o=f.opts[+x];return o.lab||o.h}).join(' · ')}
function res(){
 const sc=cur.sc;const msg=sc===5?pick(['מושלם. ככה ניגשים לבגרות 🏆','5/5 – סט נקי ⚡']):sc===4?pick(['כמעט מושלם 💪','חזק! עוד טעות אחת לתקן']):sc>=2?pick(['בכיוון הנכון – עכשיו מתקנים 🔧','יש על מה לעבוד, וזה בדיוק המטרה']):pick(['סט קשה. הטעויות למטה הן הזהב 🧠','כל טעות כאן היא טעות שלא תהיה בבגרות']);
 const good=[],work=[];cur.qs.forEach((q,i)=>{const r=cur.res[i];r.st==='ok'?good.push(SK[q.skill].n):work.push(`${SK[q.skill].n}: ${(ERR[r.e]||ERR.arithmetic)[0]}`)});
 app.innerHTML=`<div class="rh"><span class="logo">SET #${cur.n} · RESULTS</span><div class="big">${sc}/5</div><div class="msg">${msg}</div>
 <span class="pill">+${cur.xp} XP</span>${cur.up?`<span class="pill" style="color:var(--cy);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)">LEVEL UP → ${lvl().name}</span>`:''}
 <div class="sum"><div class="g"><h3>✅ מה עבד</h3>${good.length?`<ul>${good.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<span class="mut">בסט הבא</span>'}</div><div class="w"><h3>🎯 על מה לעבוד</h3>${work.length?`<ul>${work.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<span class="mut">כלום. סט נקי.</span>'}</div></div></div>
 ${cur.qs.map((q,i)=>{const r=cur.res[i],t=TOPICS[q.topic],er=ERR[r.e]||ERR.arithmetic;return `<div class="rc ${r.st}" style="--c:${t.c}"><div class="rt"><span class="ri">${r.st==='ok'?'✓':r.st==='partial'?'½':'✗'}</span><span class="chip">${t.n}</span><b>${SK[q.skill].n}</b></div>
 <div class="fx">${q.F.html}</div><div class="rq">${q.ask}</div>
 <div class="ans"><div class="${r.st==='ok'?'good':'bad'}">התשובה שלך: <b>${userAns(q,cur.vals[i])}</b></div>${r.st==='ok'?'':`<div class="good">התשובה הנכונה: <b>${q.ans}</b></div>`}</div>
 ${r.st==='ok'?'':`<div class="err"><b>${r.st==='partial'?'כמעט · ':''}אופי הטעות: ${er[0]}</b><p>💡 ${er[1]}</p></div>`}
 <details ${r.st==='ok'?'':'open'}><summary>הפתרון המלא</summary><ol class="sol">${q.sol.map(s=>`<li>${s}</li>`).join('')}</ol></details></div>`}).join('')}
 <div class="cta"><button class="btn" id="nx">הסט הבא ←</button><button class="btn ghost" id="hm">מסך הבית</button></div>`;
 document.getElementById('nx').onclick=startSet;document.getElementById('hm').onclick=()=>go('home');
}
function stats(){
 const all=items(),bar=(p,c)=>`<div class="mb"><i style="width:${Math.round((p||0)*100)}%;background:${c}"></i></div>`;
 const tr=Object.entries(TOPICS).map(([k,t])=>{const a=tAcc(k,9999),r=tAcc(k,10);return `<tr><td>${t.n}</td><td>${a.n}</td><td>${a.acc==null?'—':Math.round(a.acc*100)+'%'}</td><td>${r.acc==null?'—':Math.round(r.acc*100)+'%'}</td><td style="width:26%">${bar(r.acc,t.c)}</td></tr>`}).join('');
 const sr=Object.entries(SK).map(([k,s])=>{const h=all.filter(i=>i.s===k);const a=h.length?h.reduce((x,i)=>x+val(i.st),0)/h.length:null;return `<tr><td>${s.n}</td><td>${h.length}</td><td>${a==null?'—':Math.round(a*100)+'%'}</td><td style="width:30%">${bar(a,TOPICS[s.t].c)}</td></tr>`}).join('');
 const ec={};all.forEach(i=>{if(i.st!=='ok'&&i.e&&i.e!=='blank')ec[i.e]=(ec[i.e]||0)+1});
 const er=Object.entries(ec).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([e,c])=>`<li style="margin:8px 0"><span class="cnt">${c}</span><b>${ERR[e][0]}</b><div class="mut" style="font-size:13.5px;margin-right:38px">${ERR[e][1]}</div></li>`).join('');
 const hist=S.sets.slice(-12).reverse().map(s=>{const d=new Date(s.t);return `<tr><td>${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</td><td class="mono">${s.score}/5</td><td style="width:45%">${bar(s.score/5,'linear-gradient(90deg,#22d3ee,#a78bfa)')}</td></tr>`}).join('');
 app.innerHTML=`<div class="ph"><h2>📊 סטטיסטיקה</h2><button class="link" id="bk">← חזרה</button></div>
 <div class="kpis" style="margin-top:14px"><div class="kpi"><b>${S.sets.length}</b><span>סטים</span></div><div class="kpi"><b>${all.length}</b><span>שאלות</span></div><div class="kpi"><b>${all.length?Math.round(all.reduce((a,i)=>a+val(i.st),0)/all.length*100)+'%':'—'}</b><span>דיוק</span></div><div class="kpi"><b>${S.days.length}</b><span>ימי אימון</span></div></div>
 <div class="panel"><h3>לפי נושא</h3><table><tr><th>נושא</th><th>שאלות</th><th>כולל</th><th>10 אחרונות</th><th></th></tr>${tr}</table></div>
 <div class="panel"><h3>טעויות חוזרות</h3>${er?`<ul style="list-style:none;padding:0;margin:0">${er}</ul>`:'<span class="mut">עוד אין נתונים.</span>'}</div>
 <div class="panel"><h3>לפי מיומנות</h3><table><tr><th>מיומנות</th><th>שאלות</th><th>דיוק</th><th></th></tr>${sr}</table></div>
 <div class="panel"><h3>סטים אחרונים</h3>${hist?`<table>${hist}</table>`:'<span class="mut">עוד אין סטים.</span>'}</div>
 <div class="note">הנתונים נשמרים רק בדפדפן הזה, במכשיר הזה.</div>
 <div class="cta"><button class="btn ghost sm" id="rs" style="color:var(--bad)">איפוס התקדמות</button></div>`;
 document.getElementById('bk').onclick=()=>go('home');
 document.getElementById('rs').onclick=async()=>{if(await modal('למחוק את כל ההתקדמות? אי אפשר לבטל.',['למחוק','ביטול'])){S=blank();save();go('home')}};
}
function burst(){
 const c=document.createElement('canvas');c.className='burst';document.body.appendChild(c);const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
 const cols=['#22d3ee','#a78bfa','#f472b6','#a3e635','#fbbf24'];const ps=Array.from({length:120},()=>{const a=Math.random()*Math.PI*2,v=4+Math.random()*9;return{x:W/2,y:H*.3,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,c:pick(cols),r:2+Math.random()*3,l:1}});
 const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.985;p.l-=.009;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=10;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}if(t-t0<2600)requestAnimationFrame(f);else c.remove()})(t0);
}
render();
</script>
