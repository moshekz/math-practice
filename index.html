<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המסע המתמטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--muted:#6f6790;--line:#e7e2f7;--ratio:#7c5cff;--pct:#ff4f8b;--pyth:#0fa894;--ang:#ff8a00;--ok:#16a34a;--bad:#e11d48;--part:#d97706}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3f1 0%,#ece8ff 45%,#dcf6f1 100%);background-attachment:fixed;min-height:100vh;font-size:17px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 70px}
h1,h2,h3,.disp{font-family:'Secular One',Rubik,sans-serif;font-weight:400;margin:0;line-height:1.25}
.m{unicode-bidi:isolate;direction:ltr;display:inline-block;white-space:nowrap;font-weight:700;font-family:Rubik}
button{font-family:inherit;cursor:pointer;border:0}
.muted{color:var(--muted)}
/* hero */
.hero{background:linear-gradient(135deg,#7c5cff 0%,#b14cff 50%,#ff4f8b 100%);color:#fff;border-radius:30px;padding:24px 22px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(124,92,255,.35)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.hero:before{width:220px;height:220px;left:-60px;top:-80px}
.hero:after{width:140px;height:140px;left:120px;bottom:-70px}
.hero h1{font-size:32px}
.hero .sub{opacity:.92;margin-top:4px}
.lvl{display:flex;align-items:center;gap:12px;margin-top:16px;position:relative;z-index:1}
.lvl .badge{background:#fff;color:#7c5cff;font-weight:800;border-radius:16px;padding:6px 12px;font-size:15px;white-space:nowrap}
.xpbar{flex:1;height:14px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#fff);border-radius:99px;transition:width .8s}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.18);border-radius:16px;padding:8px 14px;font-weight:600;font-size:15px}
.mascot{position:absolute;left:18px;top:14px;font-size:54px;z-index:1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
/* topics */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.tcard{background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 6px 18px rgba(43,35,80,.07);border-bottom:5px solid var(--c)}
.tcard .top{display:flex;justify-content:space-between;align-items:center}
.tcard .nm{font-weight:800;font-size:18px}
.tcard .em{font-size:26px}
.bar{height:10px;background:#f0edf9;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .8s}
.tcard .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.stars{letter-spacing:2px;font-size:15px}
.cta{display:flex;justify-content:center;margin:22px 0 8px}
.btn{background:linear-gradient(135deg,#7c5cff,#ff4f8b);color:#fff;font:700 21px Rubik;padding:16px 34px;border-radius:999px;box-shadow:0 10px 24px rgba(255,79,139,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(255,79,139,.42)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:#7c5cff;box-shadow:0 6px 16px rgba(43,35,80,.1)}
.btn.sm{font-size:16px;padding:11px 20px}
.badges{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 18px rgba(43,35,80,.07);margin-top:16px}
.blist{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.bdg{display:flex;align-items:center;gap:8px;background:#f6f3ff;border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px}
.bdg.off{opacity:.38;filter:grayscale(1)}
.bdg span{font-size:22px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:14px;color:var(--muted)}
.link{background:none;color:#7c5cff;font-weight:700;font-size:15px;padding:6px}
/* exercise page */
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 6px 18px rgba(43,35,80,.07);position:sticky;top:8px;z-index:5}
.phead h2{font-size:22px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#e6e1f6;transition:background .3s}
.dots i.on{background:linear-gradient(135deg,#7c5cff,#ff4f8b)}
.card{background:#fff;border-radius:24px;padding:18px 18px 20px;box-shadow:0 8px 22px rgba(43,35,80,.08);margin:16px 0;border-top:7px solid var(--c);animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.chip{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);padding:3px 12px;border-radius:999px;font-weight:700;font-size:14px}
.q{font-size:18px}
.q b{font-weight:700}
.hint{color:var(--muted);font-size:15px}
.fig{display:flex;justify-content:center;margin:10px 0 4px}
.fig svg{max-width:100%;height:auto}
.fields{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.inp{font:700 22px Rubik;width:128px;padding:10px 12px;border:2.5px solid var(--line);border-radius:16px;text-align:center;direction:ltr;background:#fbfaff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.ratio{display:flex;direction:ltr;gap:8px;align-items:flex-start}
.ratio .colon{font-size:32px;font-weight:800;padding-top:4px;color:var(--c)}
.ratio .part{display:flex;flex-direction:column;align-items:center;gap:4px}
.ratio .part small{font-size:13px;color:var(--muted);font-weight:600;direction:rtl}
.ratio .inp{width:96px}
/* results */
.rhero{background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 10px 26px rgba(43,35,80,.1)}
.score{font-family:'Secular One';font-size:58px;line-height:1;background:linear-gradient(135deg,#7c5cff,#ff4f8b);-webkit-background-clip:text;background-clip:text;color:transparent}
.rhero .msg{font-size:20px;font-weight:700;margin-top:8px}
.xpgain{display:inline-block;margin-top:10px;background:#fff6d6;color:#a16207;border-radius:99px;padding:5px 14px;font-weight:800}
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;text-align:right}
.sumbox{border-radius:18px;padding:12px 14px}
.sumbox.good{background:#e9fbef}
.sumbox.work{background:#fff1f3}
.sumbox h3{font-size:17px;margin-bottom:6px}
.sumbox ul{margin:0;padding-right:18px;font-size:15px}
.rcard{background:#fff;border-radius:22px;padding:16px 18px;margin:14px 0;box-shadow:0 6px 18px rgba(43,35,80,.07);border-right:8px solid var(--s)}
.rcard.ok{--s:var(--ok)}.rcard.wrong,.rcard.blank{--s:var(--bad)}.rcard.partial{--s:var(--part)}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ricon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--s);font-size:18px}
.rsk{font-weight:700}
.rq{margin:10px 0;font-size:16px;color:#3d3566}
.rq .fig svg{max-width:300px}
.ansrow{display:flex;gap:10px;flex-wrap:wrap}
.ans{background:#f6f4fc;border-radius:14px;padding:8px 12px;font-size:15px}
.ans b{font-size:17px}
.ans.mine.bad{background:#fff0f2}
.ans.right{background:#ecfbf1}
.errbox{margin-top:10px;background:#fff7e8;border:2px dashed #f5c26b;border-radius:16px;padding:10px 14px}
.errbox .lab{font-weight:800;color:#b45309}
.errbox p{margin:4px 0 0;font-size:15px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:#7c5cff;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";}
details[open] summary:before{content:"▾ "}
.sol{margin:8px 0 0;padding-right:22px;font-size:16px}
.sol li{margin:4px 0}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
/* parent */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.tile{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 6px 16px rgba(43,35,80,.07)}
.tile b{display:block;font-size:26px;font-family:'Secular One'}
.tile span{font-size:13px;color:var(--muted)}
.panel{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 18px rgba(43,35,80,.07);margin:14px 0}
.panel h3{font-size:20px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 6px;border-bottom:1px solid #f0edf7;text-align:right;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px}
.minibar{height:9px;background:#f0edf9;border-radius:99px;overflow:hidden;min-width:70px}
.minibar i{display:block;height:100%;border-radius:99px}
.errlist li{margin:6px 0}
.cnt{display:inline-block;min-width:28px;text-align:center;background:#ffe4e9;color:var(--bad);border-radius:99px;font-weight:800;font-size:13px;padding:1px 8px;margin-left:6px}
.exam td:first-child{font-weight:600}
.danger{background:#fff0f2;color:var(--bad)}
/* modal & confetti */
.ov{position:fixed;inset:0;background:rgba(30,20,60,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mod{background:#fff;border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mod p{font-size:18px;margin:0 0 16px}
.mod .actions{margin-top:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2350;color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:70;animation:fade .3s}
@media (max-width:560px){
 .topics{grid-template-columns:1fr 1fr;gap:9px}
 .tcard{padding:12px}
 .pgrid{grid-template-columns:repeat(2,1fr)}
 .sumrow{grid-template-columns:1fr}
 .hero h1{font-size:26px}
 .mascot{font-size:40px}
 .inp{width:112px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===================== utilities ===================== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const near=(a,b,t=0.06)=>Math.abs(a-b)<=t;
const fmt=n=>{if(n==null||!isFinite(n))return '?';return String(Math.round(n*100)/100)};
const M=s=>`<span class="m">${s}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=b=>b>=0?`+ ${b}`:`− ${-b}`;
const expr=(a,b)=>`${a}x ${sg(b)}`;
function parseNum(raw){let s=String(raw||'').trim().replace(/[₪°%\s]/g,'').replace(',','.').replace('−','-');if(s==='')return null;const n=Number(s);return isNaN(n)?NaN:n}

/* ===================== error catalogue ===================== */
const ERR={
 blank:{l:'לא נענה',t:'כדאי לנסות תמיד – גם ניסיון חלקי עוזר ללמוד.'},
 arithmetic:{l:'טעות חישוב',t:'יכול להיות שהדרך נכונה – כדאי לבדוק כל שלב בחישוב.'},
 not_reduced:{l:'היחס לא מצומצם',t:'מחלקים את שני המספרים באותו מספר, הגדול ביותר שאפשר, עד שאין להם מחלק משותף.'},
 reversed:{l:'סדר הפוך ביחס',t:'הסדר ביחס הוא לפי סדר המילים בשאלה: מה שמוזכר ראשון נכתב ראשון.'},
 whole_missing_part:{l:'השלם לא כולל את החלק עצמו',t:'"כל הפריטים" כולל גם את הפריט שעליו שואלים. מחברים את כולם.'},
 ratio_copied:{l:'מספר מהיחס במקום כמות',t:'השאלה "כמה?" מחכה למספר אחד. מוצאים פי כמה גדלה הקבוצה, וכופלים גם את החלק השני באותו מספר.'},
 ratio_for_count:{l:'כתבת יחס במקום מספר',t:'השאלה מבקשת כמות, כלומר מספר אחד ולא יחס.'},
 scale_add:{l:'חיברת במקום לכפול',t:'ביחס הכמויות גדלות "פי" משהו (כפל), ולא "עוד" משהו (חיבור).'},
 scale_wrong_factor:{l:'כפלת במספר הלא נכון',t:'קודם מוצאים את המקדם: הכמות הנתונה ÷ החלק שלה ביחס. אחר כך כופלים במקדם את החלק השני.'},
 ratio_inverted:{l:'הפכת את היחס',t:'בדקי איזה מספר ביחס שייך לאיזו קבוצה.'},
 divided_one_part:{l:'חילקת בחלק אחד במקום בסכום החלקים',t:'יחס 4:5 אומר שיש 4+5=9 חלקים שווים. מחלקים את סך הכול בסכום החלקים.'},
 half_way:{l:'עצרת באמצע',t:'מצאת כמה יש בחלק אחד. עכשיו כופלים אותו במספר החלקים של הקבוצה.'},
 groups_swapped:{l:'החלפת בין הקבוצות',t:'המספר הראשון ביחס שייך לקבוצה שמוזכרת ראשונה.'},
 sum_check:{l:'הסכום לא מתאים לסך הכול',t:'בדיקה מהירה: שתי הקבוצות יחד חייבות לתת את המספר הכולל.'},
 pct_added:{l:'הוספת את האחוז במקום לחלק',t:'אם X הם p% מהשלם, אז השלם = X ÷ (p/100). למשל: 21 ÷ 0.7 = 30.'},
 pct_of_part:{l:'חישבת אחוז מהחלק',t:'כאן החלק כבר נתון ומחפשים את השלם, ולכן מחלקים ולא כופלים. השלם תמיד גדול מהחלק.'},
 pct_unit:{l:'בלבול בין אחוז למספר',t:'p% פירושו p/100. למשל 70% = 0.7. ההנחה בשקלים היא לא האחוז עצמו.'},
 pct_complement:{l:'השתמשת באחוז הלא נכון',t:'בדקי: המספר הנתון מייצג את האחוז שבשאלה, או את מה שנשאר?'},
 pct_wrong_base:{l:'חילקת באחוז ההנחה',t:'אחרי הנחה של p% משלמים (100−p)%. לכן: המחיר ששולם ÷ (100−p)/100 = המחיר המקורי.'},
 pct_mixed_final:{l:'בלבול בין ההנחה למחיר הסופי',t:'גובה ההנחה הוא כמה חוסכים. המחיר הסופי הוא המחיר המקורי פחות ההנחה.'},
 pct_wrong_dir:{l:'הוספת במקום להוריד',t:'בהנחה המחיר יורד, ולכן מחסרים את ההנחה.'},
 pct_summed:{l:'חיברת את האחוזים',t:'ההנחה השנייה מחושבת על המחיר שאחרי ההנחה הראשונה, ולכן אי אפשר פשוט לחבר את האחוזים.'},
 pct_one_step:{l:'חישבת רק הנחה אחת',t:'יש שתי הנחות. אחרי הראשונה מחשבים את השנייה על המחיר החדש.'},
 sq_doubled:{l:'חזקה חושבה ככפל ב-2',t:'7² = 7×7 = 49, ולא 7×2 = 14. החזקה אומרת לכפול את המספר בעצמו.'},
 sq_sum:{l:'ריבעת את הסכום',t:'מרבעים כל מספר לחוד ורק אז מחברים: 3² + 4² = 9 + 16 = 25, ולא (3+4)².'},
 no_square:{l:'חיברת צלעות בלי ריבוע',t:'בפיתגורס מחברים את הריבועים: a² + b² = c².'},
 no_root:{l:'שכחת להוציא שורש',t:'החישוב נותן את c² – בסוף צריך להוציא שורש כדי לקבל את אורך הצלע.'},
 hyp_add:{l:'חיברת במקום לחסר',t:'כשמחפשים ניצב: ניצב² = יתר² − ניצב². היתר הוא הצלע הארוכה, מול הזווית הישרה.'},
 hyp_sub:{l:'חיסרת במקום לחבר',t:'כשמחפשים את היתר (מול הזווית הישרה) מחברים: c² = a² + b².'},
 eq_wrong_rel:{l:'קשר לא נכון בין הזוויות',t:'זוויות מתאימות, מתחלפות וקודקודיות שוות. זוויות צמודות וחד-צדדיות משלימות ל-180°.'},
 eq_sign:{l:'טעות סימן בהעברת אגפים',t:'כשמעבירים מספר לצד השני של המשוואה, הסימן שלו מתהפך.'},
 equation_solve:{l:'טעות בפתרון המשוואה',t:'בדיקה: מציבים את ה-x שמצאת בשני הביטויים ובודקים שהקשר מתקיים.'},
 subst_sign:{l:'טעות סימן בהצבה',t:'אם כתוב 4x − 18, אחרי ההצבה מחסרים 18 ולא מוסיפים.'},
 subst_const:{l:'שכחת את המספר בהצבה',t:'מציבים את x בכל הביטוי. גם המספר שאחרי ה-x הוא חלק מגודל הזווית.'},
 angle_supp:{l:'חישבת את הזווית השנייה',t:'שימי לב לאיזו זווית שואלים. הזווית השנייה היא 180° פחות הזווית הזאת.'}
};

/* ===================== checkers ===================== */
function checkNum(raw,correct,traps=[],colonErr='ratio_for_count'){
 const s=String(raw||'').trim();
 if(!s)return{st:'blank',e:'blank'};
 if(s.includes(':'))return{st:'wrong',e:colonErr};
 const v=parseNum(s);
 if(isNaN(v))return{st:'wrong',e:'arithmetic'};
 if(near(v,correct))return{st:'ok'};
 for(const [val,e] of traps){if(val==null||!isFinite(val)||near(val,correct))continue;if(near(v,val))return{st:'wrong',e}}
 return{st:'wrong',e:'arithmetic'};
}
function checkRatio(ra,rb,p,q,traps=[]){
 if(!String(ra||'').trim()&&!String(rb||'').trim())return{st:'blank',e:'blank'};
 const a=parseNum(ra),b=parseNum(rb);
 if(a==null||b==null||isNaN(a)||isNaN(b)||a<=0||b<=0)return{st:'wrong',e:'arithmetic'};
 const g=gcd(p,q),P=p/g,Q=q/g;
 if(Math.abs(a*Q-b*P)<1e-9){if(a===P&&b===Q)return{st:'ok'};return{st:'partial',e:'not_reduced'}}
 if(Math.abs(a*P-b*Q)<1e-9&&P!==Q)return{st:'wrong',e:'reversed'};

function combine(rs){

 if(rs.every(r=>r.st==='ok'))return{st:'ok'};
 const bad=rs.find(r=>r.st==='wrong')||rs.find(r=>r.st!=='ok');
 if(rs.some(r=>r.st==='ok'))return{st:'partial',e:bad.e};

  const P=mk.at==='top'?T1:T2,[u1,u2]=RAYS[mk.pos],r=20;
  s+=`<path d="M${P.x+u1.x*r},${P.y+u1.y*r} A${r},${r} 0 0 0 ${P.x+u2.x*r},${P.y+u2.y*r}" fill="none" stroke="${mk.c}" stroke-width="4" stroke-linecap="round"/>`;
  const bx=u1.x+u2.x,by=u1.y+u2.y,bl=Math.hypot(bx,by),off=ACUTE[mk.pos]?72:42;
  const lx=P.x+bx/bl*off,ly=P.y+by/bl*off,w=mk.label.length*9+16;
  s+=`<rect x="${lx-w/2}" y="${ly-14}" width="${w}" height="28" rx="14" fill="${mk.c}"/><text x="${lx}" y="${ly+1}" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#fff" font-family="Rubik">${mk.label}</text>`;

const REL_EQ={
 corr:{n:'מתאימות',pairs:[['top','TR','bot','TR'],['top','TL','bot','TL'],['top','BL','bot','BL'],['top','BR','bot','BR']]},
 alt:{n:'מתחלפות',pairs:[['top','BL','bot','TR'],['top','BR','bot','TL']]},
 vert:{n:'קודקודיות',pairs:[['top','TR','top','BL'],['bot','TL','bot','BR'],['top','TL','top','BR'],['bot','TR','bot','BL']]}
};
const REL_SUP={
 adj:{n:'צמודות',pairs:[['top','TR','top','TL'],['bot','BL','bot','BR'],['top','BR','top','TR'],['bot','TL','bot','BL']]},
 coint:{n:'חד-צדדיות (פנימיות)',pairs:[['top','BR','bot','TR'],['top','BL','bot','TL']]}
};
function mkExprs(x,ang1,ang2){
 let a,c,b,d,tries=0;
 do{a=R(2,9);c=R(2,9);b=ang1-a*x;d=ang2-c*x;tries++}while((a===c&&ang1===ang2)||b===0||d===0||Math.abs(b)>150||Math.abs(d)>150||(tries<40&&b>0&&d>0));
 return{a,b,c,d};
}
function angCheck(v,x,ang,a,b,c,d,wrongX){
 const sx=String(v.x||'').trim(),sa=String(v.g||'').trim();
 if(!sx&&!sa)return{st:'blank',e:'blank'};
 const xv=parseNum(sx),av=parseNum(sa);
 const xOk=xv!=null&&near(xv,x),aOk=av!=null&&near(av,ang);
 if(xOk&&aOk)return{st:'ok'};
 if(!xOk){
  let e='equation_solve';
  if(xv==null||isNaN(xv))e=sx?'arithmetic':'blank';
  else{for(const [w,er] of wrongX)if(w!=null&&isFinite(w)&&!near(w,x)&&near(xv,w)){e=er;break}}
  return{st:aOk?'partial':'wrong',e};
 }
 // x correct, angle wrong
 if(av==null||isNaN(av))return{st:'partial',e:sa?'arithmetic':'blank'};
 const t=[[a*x-b,'subst_sign'],[c*x-d,'subst_sign'],[a*x,'subst_const'],[c*x,'subst_const'],[180-ang,'angle_supp']];
 for(const [w,er] of t)if(!near(w,ang)&&near(av,w))return{st:'partial',e:er};
 return{st:'partial',e:'arithmetic'};
}
function solveSteps(a,b,c,d,x){
 const coef=a>c?a-c:c-a,rhs=a>c?d-b:b-d;
 return [`${M(expr(a,b)+' = '+expr(c,d))}`,a>c?`${M(a+'x − '+c+'x = '+d+' '+(b>=0?'− '+b:'+ '+(-b)))}`:`${M(c+'x − '+a+'x = '+b+' '+(d>=0?'− '+d:'+ '+(-d)))}`,`${M(coef+'x = '+rhs)} ⟸ ${M('x = '+x)}`];
}
function genA1(){
 const key=pick(Object.keys(REL_EQ)),rel=REL_EQ[key],pr=pick(rel.pairs);
 const acute=ACUTE[pr[1]];const ang=acute?R(35,80):R(100,145);
 let x,e;do{x=R(5,30);e=mkExprs(x,ang,ang)}while(e.a===e.c);
 const {a,b,c,d}=e;const e1=expr(a,b),e2=expr(c,d);
 const wrongX=[[(180-b-d)/(a+c),'eq_wrong_rel'],[(d+b)/(a-c),'eq_sign'],[(-d-b)/(a-c),'eq_sign'],[(b-d)/(a-c),'eq_sign'],[(d-b)/(a+c),'eq_sign']];
 return{
  q:`<b>שני הישרים המסומנים בחצים מקבילים. מצאי את x ואת גודל הזווית שמסומנת ${M(e1)}</b>`,
  svg:angSvg([{at:pr[0],pos:pr[1],label:e1,c:'#ff8a00'},{at:pr[2],pos:pr[3],label:e2,c:'#7c5cff'}]),
  fields:[{k:'x',kind:'num',label:'x ='},{k:'g',kind:'num',label:'גודל הזווית (°)'}],
  check:v=>angCheck(v,x,ang,a,b,c,d,wrongX),
  ans:`x = ${x}, הזווית ${ang}°`,
  sol:[`הזוויות ${rel.n}, ולכן הן שוות.`,...solveSteps(a,b,c,d,x),`הצבה: ${M(a+' · '+x+' '+sg(b)+' = '+a*x+' '+sg(b)+' = '+ang+'°')}`,`בדיקה: ${M(c+' · '+x+' '+sg(d)+' = '+ang+'°')} ✓`]
 };
}
function genA2(){
 const key=pick(Object.keys(REL_SUP)),rel=REL_SUP[key],pr=pick(rel.pairs);
 const acute=ACUTE[pr[1]];const ang=acute?R(35,80):R(100,145),ang2=180-ang;
 const x=R(5,25);const {a,b,c,d}=mkExprs(x,ang,ang2);
 const e1=expr(a,b),e2=expr(c,d);
 const wrongX=[[a!==c?(d-b)/(a-c):null,'eq_wrong_rel'],[(180+b+d)/(a+c),'eq_sign'],[(180-b+d)/(a+c),'eq_sign'],[(180+b-d)/(a+c),'eq_sign'],[(180-b-d)/(a-c),'eq_sign']];
 return{
  q:`<b>שני הישרים המסומנים בחצים מקבילים. מצאי את x ואת גודל הזווית שמסומנת ${M(e1)}</b>`,
  svg:angSvg([{at:pr[0],pos:pr[1],label:e1,c:'#ff8a00'},{at:pr[2],pos:pr[3],label:e2,c:'#7c5cff'}]),
  fields:[{k:'x',kind:'num',label:'x ='},{k:'g',kind:'num',label:'גודל הזווית (°)'}],
  check:v=>angCheck(v,x,ang,a,b,c,d,wrongX),
  ans:`x = ${x}, הזווית ${ang}°`,
  sol:[`הזוויות ${rel.n}, ולכן הן משלימות ל-180°.`,`${M(expr(a,b)+' + '+expr(c,d)+' = 180')}`,`${M((a+c)+'x '+sg(b+d)+' = 180')} ⟸ ${M((a+c)+'x = '+(180-b-d))} ⟸ ${M('x = '+x)}`,`הצבה: ${M(a+' · '+x+' '+sg(b)+' = '+ang+'°')}`,`בדיקה: ${M(ang+' + '+ang2+' = 180')} ✓`]
 };
}

 R1:{t:'ratio',n:'צמצום יחס',w:2,prior:.3,g:genR1},

 A1:{t:'ang',n:'זוויות שוות',w:2,prior:.5,g:genA1},
 A2:{t:'ang',n:'זוויות משלימות ל-180°',w:1.5,prior:.5,g:genA2}

/* ===================== analytics ===================== */
function allItems(){const out=[];for(const p of S.pages)for(const it of p.items)out.push({...it,t:p.t});return out}
function skillHist(sk){return allItems().filter(i=>i.s===sk)}
function skillAcc(sk){const h=skillHist(sk).slice(-12);const ok=h.reduce((a,i)=>a+val(i.st),0);return(ok+SK[sk].prior*3)/(h.length+3)}
function skillW(sk){return SK[sk].w*(0.35+1.65*(1-skillAcc(sk)))}
function topicStats(t,last=15){const h=allItems().filter(i=>SK[i.s]&&SK[i.s].t===t);const l=h.slice(-last);return{n:h.length,acc:l.length?l.reduce((a,i)=>a+val(i.st),0)/l.length:null}}
function wpick(items,wf){const ws=items.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]}
function buildPage(){
 const tl=Object.keys(TOPICS);
 const extra=wpick(tl,t=>Object.keys(SK).filter(k=>SK[k].t===t).reduce((a,k)=>a+skillW(k),0));
 const used=new Set(),exs=[];
 for(const t of [...tl,extra]){
  const cands=Object.keys(SK).filter(k=>SK[k].t===t&&!used.has(k));
  const sk=wpick(cands,skillW);used.add(sk);
  const ex=SK[sk].g();ex.skill=sk;ex.topic=t;exs.push(ex);
 }
 return shuffle(exs);
}
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function streak(){
 const set=new Set(S.days);let n=0;const d=new Date();
 if(!set.has(todayStr()))d.setDate(d.getDate()-1);
 while(set.has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())){n++;d.setDate(d.getDate()-1)}
 return n;
}
function level(){const l=Math.floor(S.xp/LV_XP);return{i:l,name:LEVELS[Math.min(l,LEVELS.length-1)],pct:(S.xp%LV_XP)/LV_XP*100,toNext:LV_XP-S.xp%LV_XP}}
function checkBadges(){
 const got=new Set(S.badges),nw=[];const add=id=>{if(!got.has(id)){got.add(id);nw.push(id)}};
 if(S.pages.length>=1)add('first');
 if(S.pages.some(p=>p.score===p.n))add('perfect');
 if(streak()>=3)add('streak3');
 if(S.pages.length>=10)add('pages10');
 for(const t of Object.keys(TOPICS)){const h=allItems().filter(i=>SK[i.s].t===t).slice(-10);if(h.length>=8&&h.reduce((a,i)=>a+val(i.st),0)/h.length>=.8)add(t)}
 S.badges=[...got];return nw;
}

 const score=cur.res.filter(r=>r.st==='ok').length;
 let xp=cur.res.reduce((a,r)=>a+(r.st==='ok'?10:r.st==='partial'?4:0),0);
 if(score===cur.exs.length)xp+=20;else if(score>=cur.exs.length-1)xp+=10;
 const before=level().i;
 S.xp+=xp;
 S.pages.push({t:Date.now(),score,n:cur.exs.length,items:cur.exs.map((ex,i)=>({s:ex.skill,st:cur.res[i].st,e:cur.res[i].e||null}))});
 if(S.pages.length>200)S.pages=S.pages.slice(-200);
 if(!S.days.includes(todayStr()))S.days.push(todayStr());
 if(S.days.length>120)S.days=S.days.slice(-120);
 cur.xp=xp;cur.score=score;cur.newBadges=checkBadges();cur.levelUp=level().i>before;
 save();go('results');
 if(score>=4)setTimeout(confetti,250);
}
function userAns(ex,v){
 return ex.fields.map(f=>{
  if(f.kind==='ratio'){const a=(v[f.k+'_a']||'').trim(),b=(v[f.k+'_b']||'').trim();return(a||b)?M(esc(a||'?')+' : '+esc(b||'?')):'—'}
  const s=(v[f.k]||'').trim();return(ex.fields.length>1?f.label.replace(/\s*\(.*\)/,'')+': ':'')+(s?M(esc(s)):'—');
 }).join(' · ');
}
function renderResults(){
 const n=cur.exs.length,sc=cur.score;
 const msg=sc===n?pick(['מושלם! את תותחית! 🏆','וואו, הכול נכון! 🌟']):sc>=n-1?pick(['כמעט מושלם! כל הכבוד! 💪','מעולה! עוד צעד קטן לשלמות 🚀']):sc>=Math.ceil(n/2)?pick(['יפה מאוד! ממשיכות להשתפר 🌈','התקדמות יפה – בואי נראה מה ללמוד מהטעויות 🔍']):pick(['כל טעות היא הזדמנות ללמוד משהו 🌱','לא נורא! בדיוק בשביל זה מתרגלים 💜']);
 const good=[],work=[];
 cur.exs.forEach((ex,i)=>{const r=cur.res[i];if(r.st==='ok')good.push(SK[ex.skill].n);else work.push(`${SK[ex.skill].n}: ${ERR[r.e]?ERR[r.e].l:'טעות'}`)});
 const cards=cur.exs.map((ex,i)=>{
  const r=cur.res[i],t=TOPICS[ex.topic],er=ERR[r.e]||ERR.arithmetic;
  const icon=r.st==='ok'?'✓':r.st==='partial'?'½':'✗';
  return `<div class="rcard ${r.st}"><div class="rtop"><span class="ricon">${icon}</span><span class="chip" style="--c:${t.c}">${t.e} ${t.n}</span><span class="rsk">${SK[ex.skill].n}</span></div>
  <div class="rq">${ex.q}${ex.svg?`<div class="fig">${ex.svg}</div>`:''}</div>
  <div class="ansrow"><div class="ans mine ${r.st==='ok'?'':'bad'}">התשובה שלך: <b>${userAns(ex,cur.vals[i])}</b></div>${r.st==='ok'?'':`<div class="ans right">התשובה הנכונה: <b>${ex.ans}</b></div>`}</div>
  ${r.st==='ok'?'':`<div class="errbox"><div class="lab">${r.st==='partial'?'כמעט! ':''}אופי הטעות: ${er.l}</div><p>💡 ${er.t}</p></div>`}
  <details ${r.st==='ok'?'':'open'}><summary>איך פותרים?</summary><ol class="sol">${ex.sol.map(s=>`<li>${s}</li>`).join('')}</ol></details></div>`;
 }).join('');
 const nb=cur.newBadges.map(id=>BADGES.find(b=>b.id===id)).map(b=>`<div class="bdg"><span>${b.e}</span>תג חדש: ${b.n}</div>`).join('');
 app.innerHTML=`<div class="rhero"><div class="muted">דף ${cur.n} – תוצאות</div><div class="score">${sc}/${n}</div><div class="msg">${msg}</div>
 <span class="xpgain">+${cur.xp} נקודות ⭐</span>${cur.levelUp?`<div class="xpgain" style="background:#ede9ff;color:#6d28d9;margin-right:6px">עלית לרמה ${level().i+1}: ${level().name}! 🎉</div>`:''}
 ${nb?`<div class="blist" style="justify-content:center">${nb}</div>`:''}
 <div class="sumrow"><div class="sumbox good"><h3>✅ במה הצלחת</h3>${good.length?`<ul>${good.map(g=>`<li>${g}</li>`).join('')}</ul>`:'<div class="muted">בדף הבא זה יגיע!</div>'}</div>
 <div class="sumbox work"><h3>🎯 על מה לעבוד</h3>${work.length?`<ul>${work.map(g=>`<li>${g}</li>`).join('')}</ul>`:'<div class="muted">כלום! הכול נכון 🎉</div>'}</div></div></div>
 ${cards}
 <div class="actions"><button class="btn" id="next">לדף הבא ←</button><button class="btn sec" id="home">🏠 למסך הבית</button></div>`;
 document.getElementById('next').onclick=startPage;
 document.getElementById('home').onclick=()=>go('home');
}
function renderParent(){
 const items=allItems(),tot=items.length,acc=tot?items.reduce((a,i)=>a+val(i.st),0)/tot:0;
 const first=S.pages.slice(0,3),last=S.pages.slice(-3);
 const pAcc=ps=>{const it=ps.flatMap(p=>p.items);return it.length?it.reduce((a,i)=>a+val(i.st),0)/it.length:0};
 const trend=S.pages.length>=4?Math.round((pAcc(last)-pAcc(first))*100):null;
 const bar=(p,c)=>`<div class="minibar"><i style="width:${Math.round(p*100)}%;background:${c}"></i></div>`;
 const topicRows=Object.entries(TOPICS).map(([k,t])=>{const all=topicStats(k,9999),rec=topicStats(k,10);return `<tr><td>${t.e} ${t.n}</td><td>${all.n}</td><td>${all.acc==null?'—':Math.round(all.acc*100)+'%'}</td><td>${rec.acc==null?'—':Math.round(rec.acc*100)+'%'}</td><td style="width:30%">${bar(rec.acc||0,t.c)}</td></tr>`}).join('');
 const skRows=Object.entries(SK).map(([k,s])=>{const h=skillHist(k);const a=h.length?h.reduce((x,i)=>x+val(i.st),0)/h.length:null;const lastE=[...h].reverse().find(i=>i.st!=='ok');return `<tr><td>${s.n}</td><td>${h.length}</td><td>${a==null?'—':Math.round(a*100)+'%'}</td><td style="width:22%">${bar(a||0,TOPICS[s.t].c)}</td><td class="muted" style="font-size:13px">${lastE&&lastE.e&&ERR[lastE.e]?ERR[lastE.e].l:''}</td></tr>`}).join('');
 const ec={};items.forEach(i=>{if(i.st!=='ok'&&i.e&&i.e!=='blank')ec[i.e]=(ec[i.e]||0)+1});
 const recentEc={};S.pages.slice(-5).flatMap(p=>p.items).forEach(i=>{if(i.st!=='ok'&&i.e)recentEc[i.e]=(recentEc[i.e]||0)+1});
 const errs=Object.entries(ec).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([e,c])=>`<li><span class="cnt">${c}</span><b>${ERR[e].l}</b>${recentEc[e]?'':' <span class="muted" style="font-size:13px">(לא חזרה ב-5 הדפים האחרונים ✓)</span>'}<div class="muted" style="font-size:14px;margin-right:40px">${ERR[e].t}</div></li>`).join('');
 const hist=S.pages.slice(-12).reverse().map(p=>{const d=new Date(p.t);return `<tr><td>${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</td><td>${p.score}/${p.n}</td><td style="width:40%">${bar(p.score/p.n,'linear-gradient(90deg,#7c5cff,#ff4f8b)')}</td></tr>`}).join('');
 app.innerHTML=`<div class="phead"><h2>👨‍👩‍👧 מסך הורים</h2><button class="link" id="home">← חזרה</button></div>
 <div class="pgrid"><div class="tile"><b>${S.pages.length}</b><span>דפים שהושלמו</span></div><div class="tile"><b>${tot}</b><span>תרגילים</span></div><div class="tile"><b>${tot?Math.round(acc*100)+'%':'—'}</b><span>הצלחה כוללת</span></div><div class="tile"><b>${S.days.length}</b><span>ימי תרגול</span></div></div>
 ${trend!=null?`<div class="panel"><b>מגמה:</b> ${trend>=0?'📈 שיפור של':'📉 ירידה של'} ${Math.abs(trend)} נקודות אחוז בין 3 הדפים הראשונים ל-3 האחרונים.</div>`:''}
 <div class="panel"><h3>לפי נושא</h3><table><tr><th>נושא</th><th>תרגילים</th><th>הצלחה כוללת</th><th>10 אחרונים</th><th></th></tr>${topicRows}</table></div>
 <div class="panel"><h3>טעויות חוזרות</h3>${errs?`<ul class="errlist" style="list-style:none;padding:0;margin:0">${errs}</ul>`:'<div class="muted">עוד אין נתונים. התמונה תתמלא אחרי כמה דפים.</div>'}</div>
 <div class="panel"><h3>לפי מיומנות</h3><div style="overflow-x:auto"><table><tr><th>מיומנות</th><th>ניסיונות</th><th>הצלחה</th><th></th><th>טעות אחרונה</th></tr>${skRows}</table></div>
 <div class="muted" style="font-size:13px;margin-top:8px">האפליקציה בוחרת יותר תרגילים במיומנויות שבהן ההצלחה נמוכה, ופחות במיומנויות שכבר נשלטות.</div></div>
 <div class="panel"><h3>דפים אחרונים</h3>${hist?`<table>${hist}</table>`:'<div class="muted">עוד לא הושלמו דפים.</div>'}</div>
 <div class="actions"><button class="btn sec sm danger" id="reset">איפוס כל ההתקדמות</button></div>
 `;
 document.getElementById('home').onclick=()=>go('home');
 document.getElementById('reset').onclick=async()=>{if(await modal('למחוק את כל ההתקדמות? אי אפשר לבטל את הפעולה.',['למחוק','ביטול'])){S=blank();save();toast('ההתקדמות אופסה');go('home')}};
}
function modal(text,[yes,no]){return new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mod"><p>${text}</p><div class="actions"><button class="btn sm" data-y>${yes}</button><button class="btn sec sm" data-n>${no}</button></div></div>`;document.body.appendChild(o);o.querySelector('[data-y]').onclick=()=>{o.remove();res(true)};o.querySelector('[data-n]').onclick=()=>{o.remove();res(false)}})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confetti(){
 const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const x=c.getContext('2d');
 const W=c.width=innerWidth,H=c.height=innerHeight,cols=['#7c5cff','#ff4f8b','#0fa894','#ff8a00','#ffd400'];
 const ps=Array.from({length:150},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:5+Math.random()*7,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
 const t0=performance.now();
 (function f(t){x.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(t-t0<3500)requestAnimationFrame(f);else c.remove()})(t0);
}
render();
</script>
</body>
</html>
